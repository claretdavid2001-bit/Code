<style>
/* Layout: nota matinal de mesa de inversión — contexto arriba, tres horizontes, cada idea en una fila con barra de probabilidades */
:root{
  --bg:#f5f7f4; --surface:#ffffff; --fg:#121a15; --muted:#5b6b60; --line:#dde4de;
  --accent:#1e6b3a; --accent-soft:#e2efe6;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --neutral:#a7b3aa;
  --font-display:"Instrument Sans",system-ui,sans-serif; --font-body:"Instrument Sans",system-ui,sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1310; --surface:#141c17; --fg:#e7eee9; --muted:#93a398; --line:#26322a;
  --accent:#5cc189; --accent-soft:#1b2d22; --good:#4fc283; --warn:#e0a84a; --bad:#ec6b5e; --neutral:#4a574e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#141c17; --fg:#e7eee9; --muted:#93a398; --line:#26322a;
  --accent:#5cc189; --accent-soft:#1b2d22; --good:#4fc283; --warn:#e0a84a; --bad:#ec6b5e; --neutral:#4a574e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
header{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--font-display);font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-size:20px;margin:0}
.sub{color:var(--muted);margin:0;max-width:70ch}
.ctx{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 0;border-block:1px solid var(--line)}
.ctx div{display:grid}
.ctx b{font-family:var(--font-data);font-size:16px;font-variant-numeric:tabular-nums}
.ctx span{font-size:12px;color:var(--muted)}
.resumen{background:var(--accent-soft);border-radius:10px;padding:14px 16px;max-width:80ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.h{display:grid;gap:12px}
.hhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.hhead small{color:var(--muted)}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);}
@media (max-width:720px){.idea{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tk{font-family:var(--font-data);font-weight:600;font-size:17px}
.nm{color:var(--muted);font-size:14px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.p-COMPRAR{color:var(--good)} .p-VIGILAR{color:var(--warn)} .p-DESCARTAR{color:var(--bad)} .p-PENDIENTE{color:var(--muted)}
.conv{font-family:var(--font-data);font-size:12px;color:var(--muted)}
.ver{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--muted)}
.ver.ok{background:var(--accent-soft);color:var(--accent)}
.ver.bad{color:var(--bad)}
.why{margin:0;max-width:62ch}
.risk{margin:0;font-size:13.5px;color:var(--muted)}
.risk b{color:var(--fg);font-weight:600}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;font-variant-numeric:tabular-nums}
.nums div{display:grid}
.nums span{font-size:11.5px;color:var(--muted)}
.nums b{font-family:var(--font-data);font-size:14px;font-weight:600}
.big{font-size:22px!important;color:var(--accent)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:4px}
.legend em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.fan{position:relative;height:26px}
.fan .rng{position:absolute;top:11px;height:4px;background:var(--neutral);border-radius:2px}
.fan .zero{position:absolute;top:4px;width:1px;height:18px;background:var(--muted)}
.fan .med{position:absolute;top:7px;width:3px;height:12px;background:var(--accent);border-radius:1px}
.fan .lbl{position:absolute;top:-2px;white-space:nowrap;font-family:var(--font-data);font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.empty{color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px;max-width:90ch}
</style>

<script>
const D = JSON.parse(document.getElementById('datos').textContent);
const pct = (x, d=0) => x == null ? '—' : (x*100).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d}) + ' %';
const sg = (x, d=1) => x == null ? '—' : (x>0?'+':'') + pct(x,d);
const num = (x, d=2) => x == null ? '—' : x.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const V = D.veredictos || {};
document.getElementById('eb').textContent = `Informe del ${new Date(D.fecha).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}`;
document.getElementById('sub').textContent = `Datos al cierre del ${D.fecha_datos}. ${D.universo_valido} valores del IBEX 35, Euro Stoxx 50 y S&P 500. Perfil moderado: máximo 5 % por idea y 1 % de pérdida máxima si salta el stop.`;
const M = D.mercado;
document.getElementById('ctx').innerHTML = [
  [num(D.escenarios_totales,0), 'escenarios simulados hoy'],
  [pct(M.amplitud_sobre_sma200), 'valores sobre su media de 200 sesiones'],
  [sg(M.ret_1m_mediano), 'rentabilidad mediana del último mes'],
  [pct(M.vol_mediana), 'volatilidad anual mediana'],
  [num(M.eurusd,4), 'EUR/USD'],
].map(([b,s]) => `<div><b>${b}</b><span>${s}</span></div>`).join('');
if (V.resumen_mercado) { const r = document.getElementById('res'); r.hidden = false; r.innerHTML = `<b>Lectura del día.</b> ${esc(V.resumen_mercado)}`; }

function ideas(h) {
  const cands = D.horizontes[h].candidatos;
  const byT = Object.fromEntries(cands.map(c => [c.ticker, c]));
  const rev = (V.ideas || {})[h];
  if (rev && rev.length) return rev.filter(v => byT[v.ticker]).map(v => ({...byT[v.ticker], v}));
  return cands.filter(c => c.apto_perfil).slice(0,5).map(c => ({...c, v:{veredicto:'PENDIENTE', por_que:'Selección cuantitativa; pendiente de revisión por los agentes.'}}));
}

function fan(c) {
  const lo = Math.min(c.p5, -0.01), hi = Math.max(c.p95, 0.01), w = hi - lo, x = v => ((v - lo) / w * 100).toFixed(1) + '%';
  return `<div class="fan" aria-label="Rango de resultados del 5 % al 95 %">
    <div class="rng" style="left:${x(c.p5)};width:calc(${x(c.p95)} - ${x(c.p5)})"></div>
    <div class="zero" style="left:${x(0)}"></div><div class="med" style="left:${x(c.p50)}"></div>
    <span class="lbl" style="left:0;transform:none">${sg(c.p5,0)}</span><span class="lbl" style="right:0;left:auto;transform:none">${sg(c.p95,0)}</span></div>`;
}

function card(c) {
  const v = c.v, ver = v.veredicto || 'PENDIENTE';
  const po = c.p_objetivo, ps = c.p_stop, pn = 1 - po - ps;
  return `<article class="idea">
    <div style="display:grid;gap:8px;min-width:0">
      <div class="top"><span class="tk">${esc(c.ticker)}</span><span class="nm">${esc(c.nombre)} · ${esc(c.mercado)}</span>
        <span class="pill p-${ver}">${ver.toLowerCase()}</span>${v.conviccion ? `<span class="conv">convicción ${v.conviccion}/5</span>` : ''}
        <span class="ver ${c.verificacion==='VERIFICADO SEC'?'ok':c.verificacion==='DISCREPANCIA'?'bad':''}" title="Contraste de fundamentales con los estados presentados ante la SEC">${{'VERIFICADO SEC':'✓ datos verificados con la SEC','DISCREPANCIA':'✗ discrepancia de datos','SIN FUENTE OFICIAL':'datos sin contraste oficial'}[c.verificacion] || 'datos sin contraste oficial'}</span></div>
      <p class="why">${esc(v.por_que)}</p>
      ${v.catalizador ? `<p class="risk"><b>Catalizador:</b> ${esc(v.catalizador)}</p>` : ''}
      ${v.riesgo ? `<p class="risk"><b>Riesgo clave:</b> ${esc(v.riesgo)}</p>` : ''}
      ${[...(c.discrepancias||[]),...(c.avisos_calidad||[])].length ? `<p class="risk"><b>Calidad del dato:</b> ${esc([...(c.discrepancias||[]),...(c.avisos_calidad||[])].join('; '))}</p>` : ''}
    </div>
    <div style="display:grid;gap:8px;min-width:0">
      <div class="nums">
        <div><span>Prob. de ganancia</span><b class="big">${pct(c.p_ganancia)}</b></div>
        <div><span>Esperanza</span><b>${sg(c.esperanza_operativa)}</b></div>
        <div><span>Peso sugerido</span><b>${pct(c.peso_sugerido,1)}</b></div>
        <div><span>Entrada</span><b>${num(c.precio)}</b></div>
        <div><span>Objetivo (${sg(c.objetivo_pct,0)})</span><b>${num(c.precio_objetivo)}</b></div>
        <div><span>Stop (${sg(c.stop_pct,0)})</span><b>${num(c.precio_stop)}</b></div>
      </div>
      <div class="bar" role="img" aria-label="Objetivo ${pct(po)}, ni uno ni otro ${pct(pn)}, stop ${pct(ps)}">
        <i style="width:${po*100}%;background:var(--good)"></i><i style="width:${pn*100}%;background:var(--neutral)"></i><i style="width:${ps*100}%;background:var(--bad)"></i></div>
      <div class="legend"><em style="--c:var(--good)">objetivo antes ${pct(po)}</em><em style="--c:var(--neutral)">ninguno ${pct(pn)}</em><em style="--c:var(--bad)">stop antes ${pct(ps)}</em></div>
      ${fan(c)}
    </div>
  </article>`;
}

const keys = Object.keys(D.horizontes);
let actual = keys[0];
try { const g = localStorage.getItem('radar-h'); if (keys.includes(g)) actual = g; } catch(e) {}
function render() {
  document.getElementById('tabs').innerHTML = keys.map(k => `<button id="t-${k}" aria-pressed="${k===actual}" data-k="${k}">${esc(D.horizontes[k].etiqueta)}</button>`).join('');
  const H = D.horizontes[actual], L = ideas(actual);
  document.getElementById('main').innerHTML = `<section class="h"><div class="hhead"><h2>${esc(H.etiqueta)}</h2>
    <small>${num(D.escenarios_por_valor,0)} escenarios por valor · horizonte de ${H.dias} sesiones</small></div>
    ${L.length ? L.map(card).join('') : '<p class="empty">Hoy ninguna idea supera los filtros del perfil moderado en este horizonte. No operar también es una decisión.</p>'}</section>`;
}
document.getElementById('tabs').addEventListener('click', e => {
  const k = e.target.closest('button')?.dataset.k; if (!k) return;
  actual = k; try { localStorage.setItem('radar-h', k); } catch(e) {} render();
});
render();
document.getElementById('foot').innerHTML = `
  <div><b>Método.</b> Cribado técnico y fundamental del universo completo; los 25 mejores por horizonte pasan a Monte Carlo (bootstrap por bloques de rentabilidades reales en EUR, volatilidad actual, deriva prudente del 7 % anual con un 30 % de media histórica). Objetivo y stop dependen de la volatilidad de cada valor, con un ratio de 1,5 a 1. Los fundamentales de EE. UU. se contrastan con los estados presentados ante la SEC (10-K y 10-Q, XBRL). Si no cuadran, la idea queda bloqueada hasta revisarla. Los valores europeos no tienen contraste oficial automático. Después, cinco agentes revisan noticias, fundamentales y riesgos y emiten el veredicto.</div>
  <div><b>Límites.</b> Las probabilidades salen de un modelo calibrado con el pasado y no garantizan nada. No recogen eventos sin precedente, como resultados, OPA o regulación. Esto no es asesoramiento financiero (art. 125 LMV): la decisión y su fiscalidad, incluida la regla de los dos meses del art. 33.5 LIRPF, son tuyas.</div>`;
</script>
